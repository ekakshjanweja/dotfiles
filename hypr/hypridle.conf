general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    after_sleep_cmd = sleep 1 && omarchy-system-wake
    inhibit_sleep = 3
}

# Screensaver and lock are handled by omarchy-shell (~/.config/omarchy/shell.json).
# hypridle handles display power and system sleep below.

# Turn display off after 15 minutes idle.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = omarchy-system-wake
}

# Turn keyboard backlight off after 15 minutes idle.
listener {
    timeout = 900
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

# Suspend after 30 minutes idle (skipped when suspend-off toggle is on).
listener {
    timeout = 1800
    on-timeout = bash -lc 'omarchy-toggle-enabled suspend-off || systemctl suspend'
}
